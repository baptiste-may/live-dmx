[package]
name = "live-dmx"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the libs name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "live_dmx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
ureq = { version = "2.10", features = ["tls", "json", "cookies"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
artnet_protocol = "0.4.4"
serialport = "4.10.0"
rosc = "0.10.1"
quick-xml = "0.37"
tauri-plugin-deep-link = "2"
tauri-plugin-log = { version = "2", features = ["colored"] }
log = "0.4"
url = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tauri-plugin-window-state = "2"
tauri-plugin-stronghold = "2"
iota_stronghold = "2.1.0"
keyring = "4"
getrandom = "0.3"
tauri-plugin-mcp-bridge = "0.13"

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Dev builds of the scrypt crate (used by stronghold's password hashing) are
# extremely slow; see https://github.com/tauri-apps/plugins-workspace/issues/2048
[profile.dev.package.scrypt]
opt-level = 3
