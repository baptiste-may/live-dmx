name: Setup toolchain

description: Install the toolchain (system deps, Bun, Rust) needed by a job. Requires actions/checkout to have run first.

inputs:
  system-deps:
    description: Install Linux system dependencies (webkit2gtk etc.).
    required: false
    default: "false"
  free-disk-space:
    description: Remove large preinstalled toolchains (Android, .NET, Haskell) to free runner disk space. Only needed for full Tauri builds.
    required: false
    default: "false"
  rust:
    description: Install the Rust toolchain and restore the cargo cache.
    required: false
    default: "false"
  cache-key:
    description: Rust cache key, so jobs with different build artifacts (clippy vs test) do not overwrite each other.
    required: false
    default: "default"
  install:
    description: Run bun install --frozen-lockfile --ignore-scripts.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: 💾 Free disk space
      if: inputs.free-disk-space == 'true'
      shell: bash
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

    - name: 🐧 Install Linux dependencies
      if: inputs.system-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils build-essential libssl-dev libudev-dev

    - uses: oven-sh/setup-bun@v2

    - name: 📦 Install frontend dependencies
      if: inputs.install == 'true'
      # Scripts are skipped because the native deps pulled transitively
      # (better-sqlite3 via daisy-ui-kit → @nuxt/content, canvas) are unused at
      # build/test time; this keeps CI deterministic and avoids native builds.
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts

    - uses: dtolnay/rust-toolchain@stable
      if: inputs.rust == 'true'
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2
      if: inputs.rust == 'true'
      with:
        workspaces: "./src-tauri -> target"
        shared-key: ${{ inputs.cache-key }}
        # PRs restore the cache saved by main but never write their own.
        save-if: ${{ github.ref == 'refs/heads/main' }}
