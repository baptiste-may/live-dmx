name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils build-essential libssl-dev libudev-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        # Scripts are skipped because the native deps pulled transitively
        # (better-sqlite3 via daisy-ui-kit → @nuxt/content, canvas) are unused at
        # build/test time; this keeps CI deterministic and avoids native builds.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Version sync guard
        run: bun run release:version -- --check

      - name: Lint, format, typecheck, tests
        run: bun run check
