name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (vue-tsc)
        run: bun run typecheck

      - name: Lint Frontend
        run: bun run lint:front

      - name: Format Check Frontend
        run: bun run format:front

      - name: Test Frontend
        run: bun run test:front

      - name: Build Frontend
        run: bun run build

  backend:
    name: Backend (Clippy, Format, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libglib2.0-dev libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format Check Backend
        run: cd src-tauri && cargo fmt -- --check

      - name: Clippy Backend
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: Test Backend
        run: cd src-tauri && cargo test
