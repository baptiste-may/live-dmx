name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-frontend:
    name: 🔍 Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          install: true

      - name: 🔢 Version sync guard
        run: bun run release:version -- --check

      - name: 🧹 Lint
        run: bun run lint:front

      - name: ✨ Format
        run: bun run format:front

      - name: 🧪 Tests
        run: bun run test:front

      - name: 🏗️ Build
        run: bun run build

  check-backend:
    name: 🦀 Backend
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          system-deps: true
          rust: true

      - name: 🧹 Lint
        run: bun run lint:back

      - name: ✨ Format
        run: bun run format:back

      - name: 🧪 Tests
        run: bun run test:back
