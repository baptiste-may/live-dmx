name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check-docs-links.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check-docs-links.mjs"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          install: true

      - name: 🏗️ Build documentation
        run: bun run docs:build
        env:
          # Matches https://<owner>.github.io/<repo>/ for this repository and any
          # fork. Set DOCS_BASE to "/" when a custom domain is configured.
          DOCS_BASE: /${{ github.event.repository.name }}/

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    name: 🚀 Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
