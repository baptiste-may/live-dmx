name: Build App

# Not run on every push: CI already compiles the backend and publish.yml builds
# every release. Run it manually (or weekly) to catch release-profile issues.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-app:
    name: 🚀 Tauri build (no bundle)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          system-deps: true
          free-disk-space: true
          rust: true
          cache-key: build
          install: true

      - name: 🏗️ Build app (no bundle)
        run: bun run build:app
