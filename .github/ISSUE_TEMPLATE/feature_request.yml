name: Feature request
description: Suggest a new capability or improvement for Live DMX.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search existing issues first.

        Describe the behaviour you would like; implementation details are optional.
  - type: textarea
    id: proposed-behaviour
    attributes:
      label: Proposed behaviour
      description: What should Live DMX do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you tried.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, mockups or examples from other lighting tools.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
