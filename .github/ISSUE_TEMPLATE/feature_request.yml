name: Feature request
description: Suggest a new capability or improvement for Live DMX.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please search existing issues first.

        Describe the problem and the behaviour you need; implementation details are optional.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult, missing or frustrating today?
      placeholder: I cannot reorder fixtures without recreating them...
    validations:
      required: true
  - type: textarea
    id: proposed-behaviour
    attributes:
      label: Proposed behaviour
      description: What should Live DMX do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you tried.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Live DMX does this concern? The area is used for triage; the matching label is applied manually.
      options:
        - UI
        - Backend
        - DMX output
        - Fixtures
        - Live
        - Show files
        - CI
        - Security
        - Performance
        - Tooling
        - Not sure
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, mockups or examples from other lighting tools.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
