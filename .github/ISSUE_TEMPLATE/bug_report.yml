name: Bug report
description: Report something that is not working in Live DMX.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.

        Do not include credentials, private show files or other sensitive data in this report.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I open the Output page, the DMX monitor stays empty...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open the Patch page
        2. Add a fixture at universe 1, address 1
        3. Go to Output and enable the universe
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs, error messages or screenshots. Remove anything private.
      render: shell
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Live DMX is affected? The area is used for triage; the matching label is applied manually.
      options:
        - UI
        - Backend
        - DMX output
        - Fixtures
        - Live
        - Show files
        - CI
        - Security
        - Performance
        - Tooling
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Live DMX version
      description: Shown in the app or in the release you installed.
      placeholder: 0.1.0-dev
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related links, show file details (remove anything private), workarounds...
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed credentials, private show files and other sensitive data from this report.
          required: true
